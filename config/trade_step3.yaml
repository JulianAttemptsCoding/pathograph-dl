version: 1.0
trade_step3:
  inputs:
    base_zarr: data/processed/trade/imf_imts_step1/trade_fob_tensor.zarr
    risk_zarr: data/processed/trade/faostat_step2/trade_risk_tensor.zarr
    node_index: data/processed/meta/node_index.csv
  windowing:
    lookback_months: 24
    horizon_months: 1
  splits:
    train: {t_min: 0, t_max: 815}
    val:   {t_min: 816, t_max: 851}
    test:  {t_min: 852, t_max: 907}
  transforms:
    apply_log1p: true
    standardize: true
    standardize_scope: train_only_observed_only
  targets:
    return_targets: false         # Default: do not return y (backward compat)
    target_kind: base             # or risk, or both
    include_target_masks: true
    # Valid-index filtering (for supervised Step5 training)
    require_target_observed: true
    min_target_observed: 1
    require_target_observed_kind: both  # Ensure both base and risk have observed cells
  outputs:
    scaler_json: data/processed/trade/trade_step3_scaler.json
