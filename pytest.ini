[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude data and build artifacts from collection
norecursedirs = .git .venv .tox build dist data docs/audits logs runs reports __pycache__ .pytest_cache .idea

# Encoding
addopts = --tb=short --strict-markers

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
