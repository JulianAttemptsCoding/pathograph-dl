[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathograph"
version = "0.1.5"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pyyaml",
  "zarr>=3.0.0",
  "torchmetrics",
  "lightning",
  "fsspec",
  "gcsfs",
  "python-json-logger>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pathograph*", "tools*"]
